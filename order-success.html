<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

	<div class="container mt-5">

	    <div class="card shadow p-4">

	        <h2 class="text-success text-center">
	            🎉 Order Placed Successfully!
	        </h2>

	        <hr>

	        <p><strong>Order ID:</strong>
	            <span th:text="${order.id}"></span>
	        </p>

	        <p><strong>Order Date:</strong>
	            <span th:text="${order.orderDate}"></span>
	        </p>

	        <p><strong>Total Amount:</strong>
	            ₹ <span th:text="${order.totalAmount}"></span>
	        </p>

	        <h5 class="mt-4">Ordered Items:</h5>

	        <ul>
	            <li th:each="item : ${order.items}">
	                <span th:text="${item.product.name}"></span>
	                -
	                Qty: <span th:text="${item.quantity}"></span>
	            </li>
	        </ul>

	        <div class="text-center mt-4">
	            <a href="/customer/products" class="btn btn-primary">
	                Continue Shopping
	            </a>

	            <a href="/customer/orders" class="btn btn-outline-secondary">
	                View My Orders
	            </a>
	        </div>

	    </div>

	</div>
</body>
</html>
