<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f6f9; }
        .order-row:hover { background-color:#f1f1f1; cursor:pointer; }
        .badge-status { padding:6px 10px; border-radius:20px; }
    </style>
</head>
<body>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>My Orders</h2>
        <a th:href="@{/customer/products}" class="btn btn-secondary">
            Continue Shopping
        </a>
    </div>

    <!-- Empty State -->
    <div th:if="${orders == null or #lists.isEmpty(orders)}"
         class="text-center mt-5">
        <h4>No Orders Yet 📦</h4>
        <p class="text-muted">You haven't placed any orders.</p>
    </div>

    <div th:if="${orders != null and !#lists.isEmpty(orders)}">

        <p>Total Orders:
            <strong th:text="${#lists.size(orders)}"></strong>
        </p>

        <table class="table table-bordered table-hover bg-white">

            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Total</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="order : ${orders}"
                class="order-row"
                th:onclick="|window.location='@{/customer/orders/{id}(id=${order.id})}'|">

                <td th:text="${order.id}"></td>

                <td th:text="${order.orderDate != null ? 
                        #temporals.format(order.orderDate, 'dd MMM yyyy HH:mm') 
                        : 'N/A'}"></td>

                <td>₹ <span th:text="${order.totalAmount}"></span></td>

				<td>
				    <span class="badge badge-status"
				          th:text="${order.status}"
				          th:classappend="${
				                order.status.name() == 'PENDING' ? ' bg-warning text-dark' :
				                order.status.name() == 'PAID' ? ' bg-primary' :
				                order.status.name() == 'SHIPPED' ? ' bg-info text-dark' :
				                order.status.name() == 'DELIVERED' ? ' bg-success' :
				                order.status.name() == 'CANCELLED' ? ' bg-danger' :
				                ' bg-secondary'
				          }">
				    </span>
				</td>

                <td>
                    <a th:href="@{/customer/orders/{id}(id=${order.id})}"
                       class="btn btn-sm btn-primary">
                        View
                    </a>
                </td>

            </tr>
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
