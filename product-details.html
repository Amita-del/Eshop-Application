<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f4f6f9; }

        .detail-box {
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
            animation: fadeIn 0.5s ease-in-out;
        }

        .product-img {
            width:100%;
            border-radius:15px;
            transition: transform 0.3s;
        }

        .product-img:hover {
            transform: scale(1.05);
        }

        .price {
            font-size:28px;
            font-weight:bold;
            color:#28a745;
        }

        .total-price {
            font-size:22px;
            font-weight:bold;
            color:#007bff;
        }

        @keyframes fadeIn {
            from {opacity:0; transform:translateY(20px);}
            to {opacity:1; transform:translateY(0);}
        }
    </style>
</head>
<body>

<div class="container mt-5">

	<div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
		<span th:text="${error}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
	</div>
	<div class="mb-3">
        <a th:href="@{/customer/products}" class="btn btn-outline-secondary">
            ← Back to Products
        </a>
    </div>
	<div class="row detail-box">

        <div class="col-md-5">
            <img th:src="@{${product.imageUrl}}" class="product-img">
        </div>

        <div class="col-md-7">

            <h2 th:text="${product.name}"></h2>
            <p th:text="${product.description}"></p>

            <p class="price">₹ <span id="unitPrice" th:text="${product.price}"></span></p>

            <p>
                Stock:
                <span id="stock" th:text="${product.stock}"></span>
            </p>

            <form th:action="@{'/customer/cart/add/' + ${product.id}}" method="post" onsubmit="return validateStock()">

                <div class="input-group mb-3" style="max-width:200px;">
                    <button type="button" class="btn btn-outline-secondary" onclick="decrease()">-</button>

                    <input type="number"
                           id="qty"
                           name="quantity"
                           value="1"
                           min="1"
                           th:attr="max=${product.stock}"
                           class="form-control text-center"
                           oninput="updateTotal()">

                    <button type="button" class="btn btn-outline-secondary" onclick="increase()">+</button>
                </div>

                <p class="total-price">
                    Total: ₹ <span id="totalPrice"></span>
                </p>

                <button id="addBtn" class="btn btn-success">
                    Add to Cart
                </button>
				
				<button type="submit" th:formaction="@{'/customer/orders/buy/' + ${product.id}}" class="btn btn-primary">
				    Buy Now
				</button>

            </form>

        </div>
    </div>
</div>

<script>
let unitPrice = parseFloat(document.getElementById("unitPrice").innerText);
let stock = parseInt(document.getElementById("stock").innerText);

function updateTotal(){
    let qty = document.getElementById("qty").value;
    document.getElementById("totalPrice").innerText = (unitPrice * qty).toFixed(2);
}

function increase(){
    let qty = document.getElementById("qty");
    if(parseInt(qty.value) < stock){
        qty.value++;
        updateTotal();
    }
}

function decrease(){
    let qty = document.getElementById("qty");
    if(parseInt(qty.value) > 1){
        qty.value--;
        updateTotal();
    }
}

function validateStock(){
    let qty = parseInt(document.getElementById("qty").value);
    if(qty > stock){
        alert("Not enough stock available!");
        return false;
    }
    return true;
}

updateTotal();
</script>

</body>
</html>
