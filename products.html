<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body { background:#f4f6f9; }

        .product-card {
            transition:0.3s;
            border-radius:15px;
            overflow:hidden;
        }

        .product-card:hover {
            transform:translateY(-8px);
            box-shadow:0 10px 25px rgba(0,0,0,0.15);
        }

        .product-img {
            height:220px;
            object-fit:cover;
        }

        .price {
            font-weight:bold;
            color:#28a745;
            font-size:18px;
        }

        .category {
            font-size:12px;
            background:#e9ecef;
            padding:3px 8px;
            border-radius:20px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/customer-navbar :: customerNavbar"></div>
<div class="container mt-4">
	<!-- Flash Messages -->
	<div th:if="${success}" 
	     class="alert alert-success alert-dismissible fade show" role="alert">
	    <span th:text="${success}"></span>
	    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
	</div>

	<div th:if="${error}" 
	     class="alert alert-danger alert-dismissible fade show" role="alert">
	    <span th:text="${error}"></span>
	    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
	</div>
    <h2 class="mb-4">All Products</h2>

    <div class="row">

        <div class="col-md-3 mb-4" th:each="product : ${products}">

            <div class="card product-card">

                <img th:src="${product.imageUrl}" class="card-img-top product-img">

                <div class="card-body">

                    <h5 th:text="${product.name}"></h5>

                    <span class="category" th:text="${product.category}"></span>

                    <p class="mt-2 price">
                        ₹ <span th:text="${product.price}"></span>
                    </p>

                    <a th:href="@{'/customer/products/' + ${product.id}}"
                       class="btn btn-primary w-100">
                        View Details
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>
</body>
</html>
