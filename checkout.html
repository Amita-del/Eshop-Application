<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f6f9; }
        .checkout-box {
            background:white;
            padding:40px;
            border-radius:20px;
        }
    </style>
</head>
<body>

<div class="container mt-5">

    <div class="checkout-box">

        <h3>Confirm Order</h3>
		<div class="mb-3">
		    <a th:href="@{/customer/cart}" class="btn btn-outline-secondary">
		        ← Back to Cart
		    </a>
		</div>
        <p><strong>Name:</strong> 
            <span th:text="${user.fullName}"></span>
        </p>

        <p><strong>Address:</strong> 
            <span th:text="${user.address}"></span>
        </p>

        <hr>

        <h5>Order Items:</h5>

        <table class="table table-bordered">
            <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cart.items}">
                <td th:text="${item.product.name}"></td>
                <td>₹ <span th:text="${item.product.price}"></span></td>
                <td th:text="${item.quantity}"></td>
                <td>
                    ₹ <span th:text="${item.product.price * item.quantity}"></span>
                </td>
            </tr>
            </tbody>
        </table>

        <hr>

        <h4 class="text-end">
            Total: ₹ <span th:text="${cartTotal}"></span>
        </h4>

        <form th:action="@{/customer/payment/checkout-payment}" method="post">
           <div class="text-end mt-3">
                <button class="btn btn-success btn-lg">
                    Confirm & Proceed to Payment
                </button>
            </div>
        </form>

    </div>

</div>

</body>
</html>
