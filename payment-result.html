<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f4f6f9; display:flex; justify-content:center; align-items:center; height:100vh; }

        .result-box {
            background:white;
            padding:50px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
            width:400px;
        }

        .icon {
            font-size:60px;
            margin-bottom:20px;
        }

        .success { color: #28a745; }
        .failure { color: #dc3545; }

        .btn-back {
            margin-top:20px;
        }
    </style>
</head>
<body>

<div class="result-box">

    <div th:if="${success}">
        <div class="icon success">✓</div>
        <h3>Payment Successful!</h3>
        <p>Your payment of ₹ <span th:text="${order.totalAmount}"></span> has been completed.</p>
    </div>

    <div th:if="${!success}">
        <div class="icon failure">✕</div>
        <h3>Payment Failed!</h3>
        <p>Your payment could not be processed. Please try again.</p>
    </div>

    <a th:href="@{/customer/orders/{id}(id=${order.id})}" class="btn btn-primary btn-back">
        Go to Order Details
    </a>

</div>

</body>
</html>
