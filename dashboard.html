<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background:#f4f6f9; }

        .sidebar {
            height:100vh;
            background: linear-gradient(180deg,#4e73df,#1cc88a);
            padding:20px;
            color:white;
            transition: 0.3s;
        }

        .sidebar a {
            display:block;
            color:white;
            padding:10px;
            margin-bottom:8px;
            text-decoration:none;
            border-radius:8px;
            transition:0.3s;
        }

        .sidebar a:hover {
            background:rgba(255,255,255,0.2);
            transform: translateX(5px);
        }

        .card-admin {
            border-radius:15px;
            padding:20px;
            color:white;
            transition:0.3s;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        .card-admin:hover {
            transform: translateY(-5px);
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
        }

        .blue { background:linear-gradient(45deg,#4e73df,#224abe); }
        .green { background:linear-gradient(45deg,#1cc88a,#13855c); }
        .orange { background:linear-gradient(45deg,#f6c23e,#dda20a); }

        .table-card {
            background:white;
            padding:20px;
            border-radius:15px;
            margin-top:30px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <h4>Admin Panel</h4>
            <a th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:href="@{/admin/products}">Products</a>
            <a th:href="@{/admin/orders}">Orders</a>
            <a th:href="@{/login/logout}">Logout</a>
        </div>

        <!-- Main -->
        <div class="col-md-10 p-4">
            <h2 class="mb-4">Dashboard Overview</h2>

            <!-- Cards -->
            <div class="row">
                <div class="col-md-4">
                    <div class="card-admin blue">
                        <h5>Total Products</h5>
                        <h3 id="productsCounter" th:data-value="${totalProducts}">0</h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card-admin green">
                        <h5>Total Orders</h5>
                        <h3 id="ordersCounter" th:data-value="${totalOrders}">0</h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card-admin orange">
                        <h5>Total Revenue</h5>
                        <h3>₹<span id="revenueCounter" th:data-value="${totalRevenue}"></span></h3>
                    </div>
                </div>
            </div>

            <!-- Chart -->
            <div class="table-card">
                <h5>Monthly Revenue</h5>
                <canvas id="revenueChart"></canvas>
            </div>

            <!-- Recent Orders -->
            <div class="table-card">
                <h5>Recent Orders</h5>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User</th>
                            <th>Total</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${recentOrders}">
                            <td th:text="${order.id}"></td>
                            <td th:text="${order.user.email}"></td>
                            <td th:text="${order.totalAmount}"></td>
                            <td th:text="${order.status}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<script>
    // Animated Counter
    function animateCounter(id) {
        let element = document.getElementById(id);
        let target = parseInt(element.getAttribute("data-value"));
        let count = 0;
        let increment = target / 100;

        let interval = setInterval(() => {
            count += increment;
            if(count >= target) {
                element.innerText = target;
                clearInterval(interval);
            } else {
                element.innerText = Math.floor(count);
            }
        }, 15);
    }

    animateCounter("productsCounter");
    animateCounter("ordersCounter");
    animateCounter("revenueCounter");

    // Chart
    const ctx = document.getElementById('revenueChart');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Jan','Feb','Mar','Apr','May','Jun'],
            datasets: [{
                label: 'Revenue',
                data: [1200, 1900, 3000, 2500, 2200, 3500],
                borderWidth: 1
            }]
        },
        options: {
            responsive:true,
            plugins: {
                legend: { display:false }
            }
        }
    });
</script>

</body>
</html>
