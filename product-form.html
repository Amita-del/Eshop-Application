<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f4f6f9; }

        .form-card {
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .form-card:hover {
            box-shadow:0 15px 35px rgba(0,0,0,0.15);
        }

        .btn-save {
            background:linear-gradient(45deg,#4e73df,#1cc88a);
            color:white;
            border:none;
            transition:0.3s;
        }

        .btn-save:hover {
            transform:scale(1.05);
            opacity:0.9;
        }

        .image-preview {
            width:120px;
            height:120px;
            object-fit:cover;
            border-radius:10px;
            margin-top:10px;
            display:none;
            border:2px solid #ddd;
        }

        .stock-status {
            font-size:14px;
            font-weight:bold;
        }

        .low-stock { color:red; }
        .in-stock { color:green; }
    </style>
</head>
<body>
<div class="container mt-5">

    <div class="form-card">

        <h3 class="mb-4 text-primary">Add / Edit Product</h3>

        <!-- Success Message -->
        <div th:if="${success}" class="alert alert-success">
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/admin/products/save}"
              th:object="${product}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text"
                       th:field="*{name}"
                       class="form-control"
                       required>
                <div class="invalid-feedback">
                    Product name is required
                </div>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}"
                          class="form-control"
                          rows="3"></textarea>
            </div>

            <!-- Category -->
            <div class="mb-3">
                <label class="form-label">Category</label>
				<select th:field="*{category}" class="form-select">
				    <option value="">Select Category</option>
				    <option value="Electronics">Electronics</option>
				    <option value="Clothing">Clothing</option>
				    <option value="Books">Books</option>
				    <option value="Home">Home</option>
				</select>
            </div>

            <!-- Price -->
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="number"
                       step="0.01"
                       th:field="*{price}"
                       id="priceInput"
                       class="form-control"
                       required
                       oninput="formatPrice()">
                <small id="pricePreview" class="text-muted"></small>
            </div>

            <!-- Stock -->
            <div class="mb-3">
                <label class="form-label">Stock</label>
                <input type="number"
                       th:field="*{stock}"
                       id="stockInput"
                       class="form-control"
                       required
                       oninput="checkStock()">
                <div id="stockStatus" class="stock-status"></div>
            </div>

            <!-- Image URL -->
            <div class="mb-3">
                <label class="form-label">Image URL</label>
                <input type="text"
                       th:field="*{imageUrl}"
                       id="imageInput"
                       class="form-control"
                       oninput="previewImage()">
                <img id="preview" class="image-preview"/>
            </div>

            <button class="btn btn-save px-4">
                Save Product
            </button>

        </form>
    </div>

</div>

<script>

// Auto preview existing image on edit
window.onload = function() {
    previewImage();
    formatPrice();
    checkStock();
};

function previewImage(){
    const input = document.getElementById("imageInput").value;
    const img = document.getElementById("preview");

    if(input){
        img.src = input;
        img.style.display = "block";
    } else {
        img.style.display = "none";
    }
}

// Price preview formatting
function formatPrice(){
    const price = document.getElementById("priceInput").value;
    const preview = document.getElementById("pricePreview");

    if(price){
        preview.innerText = "Formatted: ₹" + parseFloat(price).toFixed(2);
    } else {
        preview.innerText = "";
    }
}

// Stock indicator
function checkStock(){
    const stock = document.getElementById("stockInput").value;
    const status = document.getElementById("stockStatus");

    if(stock > 10){
        status.innerText = "In Stock";
        status.className = "stock-status in-stock";
    } else if(stock > 0){
        status.innerText = "Low Stock";
        status.className = "stock-status low-stock";
    } else {
        status.innerText = "Out of Stock";
        status.className = "stock-status low-stock";
    }
}

</script>

</body>
</html>
