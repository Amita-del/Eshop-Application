<div th:fragment="customerNavbar"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow-sm">

        <div class="container">

            <!-- LOGO -->
            <a class="navbar-brand fw-bold"
               th:href="@{/customer/products}">
                <i class="bi bi-bag-heart-fill"></i> E-Shop
            </a>

            <!-- MOBILE TOGGLE -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#customerNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- NAV CONTENT -->
            <div class="collapse navbar-collapse"
                 id="customerNavbar">

                <!-- LEFT MENU -->
                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" style="color:white"
                           th:href="@{/customer/products}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" style="color:white" 
                           th:href="@{/customer/orders}">
                            My Orders
                        </a>
                    </li>

                </ul>

                <!-- RIGHT MENU -->
                <ul class="navbar-nav align-items-center">

                    <!-- CART -->
                    <li class="nav-item me-3">
                        <a class="nav-link position-relative" style="color:white"
                           th:href="@{/customer/cart}">

                            <i class="bi bi-cart3 fs-5"></i>

                            <!-- Cart Count Badge -->
                            <span th:if="${cartCount > 0}"
                                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                                  th:text="${cartCount}">
                            </span>
                        </a>
                    </li>

                    <!-- USER DROPDOWN -->
                    <li class="nav-item dropdown">

                        <a class="nav-link dropdown-toggle"
                           href="#"
                           role="button"
                           data-bs-toggle="dropdown" style="color:white">

                            <i class="bi bi-person-circle"></i>
                            <span style="color:white" th:text="${session.loggedUser.fullName}"></span>
                        </a>

                        <ul class="dropdown-menu dropdown-menu-end shadow">

                            <li>
                                <a class="dropdown-item"
                                   th:href="@{/customer/orders}">
                                    My Orders
                                </a>
                            </li>

                            <li><hr class="dropdown-divider"></li>

                            <li>
                                <form th:action="@{/login/logout}"
                                      method="post">
                                    <button type="submit"
                                            class="dropdown-item text-danger">
                                        Logout
                                    </button>
                                </form>
                            </li>

                        </ul>

                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Spacer for fixed navbar -->
    <div style="height:75px;"></div>
</div>
