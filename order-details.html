<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f4f6f9; }

        .detail-box {
            background:white;
            padding:30px;
            border-radius:20px;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
        }

        .badge-status {
            padding:6px 12px;
            border-radius:20px;
            font-size:14px;
        }

        .table tbody tr:hover {
            background:#f1f1f1;
        }
    </style>
</head>
<body>

<div class="container mt-4">

    <!-- 🔙 Back Button -->
    <div class="mb-3">
        <a th:href="@{/customer/orders}" class="btn btn-outline-secondary">
            ← Back to Orders
        </a>
    </div>

    <div class="detail-box">

        <!-- 🔹 Order Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>
                Order #<span th:text="${order.id}"></span>
            </h3>

            <!-- Status Badge -->
			<span class="badge"
			      th:classappend="${
			            order.status != null and order.status.name() == 'PENDING' ? 'bg-warning text-dark' :
			            order.status != null and order.status.name() == 'SHIPPED' ? 'bg-info text-dark' :
			            order.status != null and order.status.name() == 'DELIVERED' ? 'bg-success' :
			            order.status != null and order.status.name() == 'CANCELLED' ? 'bg-danger' :
			            'bg-secondary'
			      }">

			    <span th:text="${order.status != null ? order.status.name() : 'UNKNOWN'}"></span>
			</span>
        </div>

        <!-- 🔹 Order Info -->
        <p>
            <strong>Date:</strong>
            <span th:text="${order.orderDate != null ?
                #temporals.format(order.orderDate, 'dd MMM yyyy HH:mm')
                : 'N/A'}"></span>
        </p>

        <hr>

        <!-- 🛒 Items Table -->
        <div th:if="${order.items != null and !#lists.isEmpty(order.items)}">

            <table class="table table-bordered bg-white">

                <thead class="table-dark">
                <tr>
                    <th>Product</th>
                    <th class="text-center">Price</th>
                    <th class="text-center">Qty</th>
                    <th class="text-end">Total</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="item : ${order.items}">
                    <td th:text="${item.product != null ? item.product.name : 'Product Removed'}"></td>

                    <td class="text-center">
                        ₹ <span th:text="${item.price}"></span>
                    </td>

                    <td class="text-center"
                        th:text="${item.quantity}"></td>

                    <td class="text-end">
                        ₹ <span th:text="${item.price.multiply(T(java.math.BigDecimal).valueOf(item.quantity.longValue()))}"></span>
                    </td>
                </tr>
                </tbody>

            </table>

        </div>

        <!-- Empty Items Protection -->
        <div th:if="${order.items == null or #lists.isEmpty(order.items)}"
             class="alert alert-warning text-center">
            No items found in this order.
        </div>

        <hr>

        <!-- 💰 Summary -->
        <div class="d-flex justify-content-between align-items-center">
            <h4>Total Amount:</h4>
            <h4 class="text-success">
                ₹ <span th:text="${order.totalAmount}"></span>
            </h4>
        </div>

        <!-- ❌ Cancel Button (Only if Pending) -->
		<div class="mt-4 text-end"
		     th:if="${order.status?.toString() == 'PENDING'}">

		    <form th:action="@{'/customer/orders/cancel/' + ${order.id}}"
		          method="post"
		          onsubmit="return confirm('Are you sure you want to cancel this order?');">

		        <button type="submit" class="btn btn-danger">
		            Cancel Order
		        </button>
		    </form>

		</div>

    </div>

</div>

</body>
</html>
