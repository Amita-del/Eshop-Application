<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background:#f4f6f9; 
            display:flex; 
            justify-content:center; 
            align-items:center; 
            height:100vh; 
        }
        .payment-box { 
            background:white; 
            padding:40px; 
            border-radius:20px; 
            width:400px; 
            box-shadow:0 10px 30px rgba(0,0,0,0.1); 
            text-align:center; 
            position:relative; 
        }
        .form-control { 
            border-radius:10px; 
            transition: all 0.3s; 
        }
        .form-control:focus { 
            box-shadow:0 0 8px #28a745; 
            border-color:#28a745; 
        }
        .btn-pay { width:100%; margin-top:20px; }
        #otpSection { display:none; margin-top:20px; }
        #spinnerOverlay { 
            display:none; 
            position:absolute; 
            top:0; left:0; 
            width:100%; height:100%; 
            background:rgba(255,255,255,0.95); 
            justify-content:center; 
            align-items:center; 
            flex-direction:column; 
            border-radius:20px; 
            z-index:100; 
        }
        .card-type { font-weight:bold; margin-bottom:10px; }
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from {opacity:0; transform:scale(0.9);} to {opacity:1; transform:scale(1);} }
    </style>
</head>
<body>

<div class="payment-box fade-in">

    <h3 class="mb-4">Complete Payment</h3>

    <!-- Order Summary -->
    <div class="mb-3 p-3 bg-light rounded">
        <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
        <p><strong>Total Amount:</strong> ₹ <span th:text="${order.totalAmount}"></span></p>
    </div>

    <!-- Payment Form -->
    <form th:action="@{/customer/payment/process/buynow}" method="post" id="paymentForm">
        <input type="hidden" name="orderId" th:value="${order.id}" />
        <input type="hidden" name="success" id="paymentSuccess" value="true">
        <input type="hidden" name="transactionId" id="transactionId">

        <div class="card-type" id="cardTypeDisplay"></div>

        <!-- Credit Card Section -->
        <div id="cardSection">
            <div class="mb-3">
                <input type="text" value="4111 1111 1111 1111" class="form-control" id="cardNumber" placeholder="Card Number (xxxx xxxx xxxx xxxx)" required maxlength="19" oninput="formatCardNumber(); detectCardType();">
            </div>
            <div class="row mb-3">
                <div class="col">
                    <input type="text" value="04/30" class="form-control" id="expiry" placeholder="MM/YY" required maxlength="5" oninput="formatExpiry();">
                </div>
                <div class="col">
                    <input type="password" value="123" class="form-control" id="cvv" placeholder="CVV" required maxlength="3">
                </div>
            </div>
            <div class="d-flex justify-content-between">
                <button type="button" class="btn btn-secondary" onclick="goBack()">Cancel</button>
                <button type="button" class="btn btn-success" onclick="validateCard()">Proceed</button>
            </div>
        </div>

        <!-- OTP Section -->
        <div id="otpSection">
            <p>Enter OTP sent to your registered email/phone</p>
            <input type="text" id="otpInput" class="form-control mb-3" placeholder="6-digit OTP" maxlength="6">
            <div class="d-flex justify-content-between">
                <button type="button" class="btn btn-primary btn-pay" id="payBtn" onclick="startPayment()">Pay ₹ <span th:text="${order.totalAmount}"></span></button>
            </div>
        </div>
    </form>

    <!-- Spinner Overlay  -->
    <div id="spinnerOverlay">
        <div class="spinner-border text-primary" role="status" style="width:4rem;height:4rem;"></div>
        <p class="mt-3" id="spinnerText">Processing Payment...</p>
    </div>

</div>

<script>
let generatedOTP = null;

// Card formatting
function formatCardNumber() {
    const input = document.getElementById('cardNumber');
    let value = input.value.replace(/\D/g,'').substring(0,16);
    input.value = value.replace(/(.{4})/g,'$1 ').trim();
}

// Detect card type
function detectCardType() {
    const value = document.getElementById('cardNumber').value.replace(/\s/g,'');
    const display = document.getElementById('cardTypeDisplay');
    if (/^4/.test(value)) display.innerText = "Visa";
    else if (/^5[1-5]/.test(value)) display.innerText = "Mastercard";
    else display.innerText = "";
}

// Expiry formatting
function formatExpiry() {
    let input = document.getElementById('expiry');
    let value = input.value.replace(/\D/g,'').substring(0,4);
    if (value.length >= 3) input.value = value.substring(0,2) + '/' + value.substring(2,4);
    else input.value = value;
}

// Luhn check
function validateLuhn(cardNumber) {
    let sum=0, double=false;
    cardNumber = cardNumber.replace(/\D/g,'');
    for(let i=cardNumber.length-1;i>=0;i--){
        let digit=parseInt(cardNumber[i]);
        if(double){ digit*=2; if(digit>9) digit-=9; }
        sum+=digit; double=!double;
    }
    return sum%10===0;
}

// Step1: Card validation + OTP
function validateCard() {
    const cardNumber = document.getElementById('cardNumber').value.trim();
    const expiry = document.getElementById('expiry').value.trim();
    const cvv = document.getElementById('cvv').value.trim();

    if(!validateLuhn(cardNumber)){ alert("Invalid card number!"); return; }
    if(!/^\d{2}\/\d{2}$/.test(expiry)){ alert("Invalid expiry! Use MM/YY"); return; }
    if(!/^\d{3}$/.test(cvv)){ alert("Invalid CVV!"); return; }

    generatedOTP = Math.floor(100000 + Math.random()*900000);
    alert("OTP sent to your registered email/phone: " + generatedOTP);

    document.getElementById('cardSection').style.display='none';
    document.getElementById('otpSection').style.display='block';
    document.getElementById('payBtn').disabled=false;
}

// Step2: Start fake payment with spinner delay
function startPayment() {
    const otpInput = document.getElementById('otpInput').value.trim();
    if (otpInput !== generatedOTP.toString()) {
        alert("Incorrect OTP!");
        return;
    }

    const spinner = document.getElementById('spinnerOverlay');
    spinner.style.display = 'flex';
    document.getElementById('spinnerText').innerText = "Processing Payment...";
    document.getElementById('payBtn').disabled = true;

    setTimeout(() => {
        const success = Math.random() > 0.2;

        document.getElementById('paymentSuccess').value = success;
        document.getElementById('transactionId').value =
            "TXN" + Math.floor(Math.random() * 1000000000);

        document.getElementById('spinnerText').innerText =
            success ? "Payment Successful!" : "Payment Failed!";

        setTimeout(() => {

            if (success) {
                document.getElementById('paymentForm').submit();
            } else {
                // Hide spinner and allow retry
                spinner.style.display = 'none';
                document.getElementById('payBtn').disabled = false;
            }

        }, 1000);

    }, 2500);
}
// Back button to previous page/home
function goBack() {
   window.location.href = "/customer/products"; 
}

// Back from OTP to Card Section
function backToCard() {
    document.getElementById('otpSection').style.display='none';
    document.getElementById('cardSection').style.display='block';
}
</script>

</body>
</html>
